spring.application.name=ledger_mgmt

# Fill these in before startup. Left blank on purpose.
# Datasource database is the reports schema from lms_ledger_schema.sql.
server.port=5000
spring.datasource.url=jdbc:mysql://localhost:3306/reports
spring.datasource.username=root
spring.datasource.password=Root@123

# Base URL of loan_mgmt, used by WebClient. Example shape: http://localhost:8081
loan-mgmt.base-url=http://localhost:5001

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# MVC stays the HTTP stack. WebClient is only the loan_mgmt client.
spring.main.web-application-type=servlet
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
spring.graphql.cors.allowed-headers=*
